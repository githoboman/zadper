# Caddy supplies the client address in X-Forwarded-For.  Use that header for
# the rate-limit key instead of $remote_addr (which would be the Caddy socket
# for every request).  The fallback keeps direct private-network requests
# bounded if an operator probes this container without Caddy.
map $http_x_forwarded_for $agentpay_rate_key {
    default $http_x_forwarded_for;
    ""      $remote_addr;
}

limit_req_zone $agentpay_rate_key zone=agentpay_api:10m rate=60r/m;
limit_req_zone $agentpay_rate_key zone=agentpay_bridge:10m rate=60r/m;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 240s;
    proxy_send_timeout 240s;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    location = /api {
        return 308 /api/;
    }

    location ^~ /api/ {
        limit_req zone=agentpay_api burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://agentpay-report-api:4021/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location = /bridge {
        return 308 /bridge/;
    }

    location ^~ /bridge/ {
        limit_req zone=agentpay_bridge burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://agentpay-mcp:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 240s;
        proxy_send_timeout 240s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
